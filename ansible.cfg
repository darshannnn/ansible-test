[defaults]
# (pathlist) Comma separated list of Ansible inventory sources
inventory=./inventory
# (pathspec) Colon separated paths in which Ansible will search for Roles.
roles_path=./roles
# (path) A number of non-playbook CLIs have a ``--playbook-dir`` argument; this sets the default value for it.
playbook_dir=./playbooks
# (path) Location under which to create temporary files on target hosts
remote_tmp=/tmp
# (boolean) Run handlers even if a task fails. Without this, a late failure
# on a host silently discards every handler queued earlier in the run, so
# config files land on disk with nothing reloading the services.
force_handlers=True