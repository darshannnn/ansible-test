---
- name: Test Host Vars
  hosts: elastic
  gather_facts: false

  tasks:
    - name: Display inventory hostname
      ansible.builtin.debug:
        var: inventory_hostname

    - name: Display all host variables
      ansible.builtin.debug:
        var: hostvars[inventory_hostname]

    - name: Test LVM variables
      ansible.builtin.debug:
        msg: "Disk: {{ disk_device | default('UNDEFINED') }}, Partition: {{ lvm_partition | default('UNDEFINED') }}, Sudoers: {{ sudoers_host | default('UNDEFINED') }}, Satellite: {{ satellite_org | default('UNDEFINED') }}"

    - name: Display sudoers
      ansible.builtin.debug:
        var: sudoers_host

    - name: All host firewall var
      ansible.builtin.debug:
        var: firewall_rules