
---
- name: Expand RHEL system LVM
  hosts: elastic
  become: true
  gather_facts: true

  vars:
    disk_device: /dev/sda
    lvm_partition: 3
    pv_device: /dev/sda3
    vg_name: system
    lv_name: var_log

    # Target total LV size, not an additional amount
    lv_target_size: 56G

  tasks:

    - name: Install growpart utility
      ansible.builtin.package:
        name: cloud-utils-growpart
        state: present

    - name: Check whether partition can be expanded
      ansible.builtin.command:
        cmd: "growpart --dry-run {{ disk_device }} {{ lvm_partition }}"
      register: growpart_check
      changed_when: false
      failed_when: growpart_check.rc != 0

    - name: Expand LVM partition if required
      ansible.builtin.command:
        cmd: "growpart {{ disk_device }} {{ lvm_partition }}"
      register: growpart_result
      changed_when: "'CHANGED:' in growpart_result.stdout"
      when: growpart_check.stdout is regex('(?m)^CHANGE:')

    - name: Resize LVM physical volume
      community.general.lvg:
        vg: "{{ vg_name }}"
        pvs:
          - "{{ pv_device }}"
        pvresize: true
        state: present

    - name: Extend var_log logical volume to target size
      community.general.lvol:
        vg: "{{ vg_name }}"
        lv: "{{ lv_name }}"
        size: "{{ lv_target_size }}"
        resizefs: true
        shrink: false
        state: present

    - name: Display final LVM configuration
      ansible.builtin.command:
        cmd: "lvs -o vg_name,lv_name,lv_size"
      register: lvm_status
      changed_when: false

    - name: Show LVM status
      ansible.builtin.debug:
        var: lvm_status.stdout_lines

