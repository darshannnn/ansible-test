
---
- name: Expand RHEL system LVM
  hosts: elastic
  become: true
  gather_facts: false

  vars:
    disk_device: /dev/sda
    lvm_partition: 3
    pv_device: /dev/sda3
    vg_name: system
    lv_name: var_log
    lv_target_size_gb: 86

  tasks:

    - name: Get current logical volume size
      ansible.builtin.command:
        cmd: "lvs --noheadings --units b --nosuffix -o lv_size /dev/{{ vg_name }}/{{ lv_name }}"
      register: current_lv_size
      changed_when: false

    - name: Expand storage if LV is below target size
      when: (current_lv_size.stdout | trim | float) < (lv_target_size_gb | int * 1024**3)
      block:

        - name: Install growpart utility
          ansible.builtin.package:
            name: cloud-utils-growpart
            state: present

        - name: Expand LVM partition
          ansible.builtin.command:
            cmd: "growpart {{ disk_device }} {{ lvm_partition }}"
          register: growpart_result
          changed_when: "'CHANGED:' in growpart_result.stdout"
          failed_when:
            - growpart_result.rc != 0
            - "'NOCHANGE:' not in growpart_result.stdout"

        - name: Resize LVM physical volume
          ansible.builtin.command:
            cmd: "pvresize {{ pv_device }}"
          register: pvresize_result
          changed_when: "'1 physical volume(s) resized' in pvresize_result.stdout"

        - name: Extend logical volume to target size
          community.general.lvol:
            vg: "{{ vg_name }}"
            lv: "{{ lv_name }}"
            size: "{{ lv_target_size_gb }}G"
            resizefs: true
            shrink: false
            state: present

    - name: Display final LVM configuration
      ansible.builtin.command:
        cmd: "lvs -o vg_name,lv_name,lv_size"
      register: lvm_status
      changed_when: false

    - name: Show LVM status
      ansible.builtin.debug:
        var: lvm_status.stdout_lines

